name: Build ARM64 Image
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -t plexcache-d:arm64 \
            --load \
            -f ./docker/Dockerfile .

      - name: Export Docker-format tar
        run: |
          # 关键：使用 docker save 导出纯 Docker 格式
          docker save -o plexcache-d-arm64.tar plexcache-d:arm64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plexcache-d-arm64-docker
          path: plexcache-d-arm64.tar
